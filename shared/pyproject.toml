[project]
name = "eggvision-shared"
version = "0.1.0"
description = "EggVision — format des données, prétraitement et moteur d'inférence communs au PC et au Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eggvision_shared"]
