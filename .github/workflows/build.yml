name: Tests et exécutables

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python scripts/fetch_pretrained.py
      - run: uv run pytest

  build:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-13]   # Windows x64, macOS Apple Silicon, macOS Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --group build
      - run: uv run python scripts/fetch_pretrained.py
      - run: uv run python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: EggVisionStudio-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.dmg
