[project]
name = "eggvision-workspace"
version = "0.1.0"
description = "EggVision Studio — monorepo (application de bureau, agent Raspberry Pi, code partagé)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "desktop", "pi-agent"]

[tool.uv.sources]
eggvision-shared = { workspace = true }
eggvision-studio = { workspace = true }
eggvision-agent = { workspace = true }

[dependency-groups]
dev = [
    "eggvision-shared",
    "eggvision-studio",
    "eggvision-agent[bench]",
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

build = [
    "pyinstaller>=6.6",
]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "desktop/tests", "pi-agent/tests"]
addopts = "-q --import-mode=importlib"
timeout = 600
markers = ["slow: tests longs (entraînement, simulation complète)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"desktop/src/eggvision/vision/pipeline.py" = ["B023"]  # lambda appelée immédiatement dans la boucle
"desktop/src/eggvision/vision/tracking.py" = ["E741"]  # s, l : coordonnées longitudinale / latérale
