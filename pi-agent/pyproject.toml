[project]
name = "eggvision-agent"
version = "0.1.0"
description = "EggVision — agent de capture pour Raspberry Pi 5 (caméra Global Shutter IMX296)"
requires-python = ">=3.11"
dependencies = [
    "eggvision-shared",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "psutil>=5.9",
    "zeroconf>=0.132",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# picamera2 est fourni par Raspberry Pi OS (apt : python3-picamera2), pas par pip.
bench = ["onnxruntime>=1.18"]

[project.scripts]
eggvision-agent = "eggvision_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eggvision_agent"]
