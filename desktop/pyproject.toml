[project]
name = "eggvision-studio"
version = "0.1.0"
description = "EggVision Studio — application de bureau (backend FastAPI + frontend React)"
requires-python = ">=3.11"
dependencies = [
    "eggvision-shared[onnx]",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "pyyaml>=6",
    "httpx>=0.27",
    "zeroconf>=0.132",
    "psutil>=5.9",
    "platformdirs>=4",
    "python-multipart>=0.0.9",
    "torch>=2.3",
    "torchvision>=0.18",
    "timm>=1.0",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.1",
    "imageio-ffmpeg>=0.5",
    "pywebview>=5.1",
]

[project.scripts]
eggvision-studio = "eggvision.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eggvision"]
